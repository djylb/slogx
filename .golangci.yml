version: "2"

linters:
  default: all
  disable:
    # Formatting and naming style that gofmt and the code's idiom already
    # settle: blank-line placement, short names in short scopes, the
    # if err := f(); err != nil form, embedded-field spacing.
    - wsl
    - wsl_v5
    - nlreturn
    - varnamelen
    - noinlineerr
    - embeddedstructfieldcheck
    - lll
    # Zero values are ready to use throughout the package; literals name
    # only the fields they set.
    - exhaustruct
    - exhaustruct_v5
    # Functions are ordered by topic, next to the code they serve.
    - funcorder
    # The encoder and the pipeline are written out in single functions on
    # purpose, so that the hot path stays inlined and free of calls; size
    # metrics flag exactly those.
    - cyclop
    - gocognit
    - gocyclo
    - nestif
    - funlen
    - maintidx
    # Tests measure timing and share process-wide state (the default
    # logger, files, goroutine leak checks); running them in parallel
    # would distort what they measure. Internal tests need the package's
    # unexported state.
    - paralleltest
    - tparallel
    - testpackage
    # Errors of the wrapped writers and files are returned as they are, so
    # that callers see the same errors as without the package.
    - wrapcheck
    # Named results document what a function returns.
    - nonamedreturns
    # Package state is deliberate: the default registry and shared tables.
    - gochecknoglobals
    # Constants are explained where they are used.
    - mnd
    # Format.Encoder and WriterOutput return the package's own
    # interfaces (Encoder, Output) on purpose.
    - ireturn
    # The errors carry the offending value for the person reading the log
    # or the HTTP reply; nothing matches on them.
    - err113
    # sync.Pool of one known type: a mismatch is a bug that must panic.
    - forcetypeassert
    # No import rules: the module has no dependencies.
    - depguard
    # Deprecated, replaced by gomodguard_v2.
    - gomodguard
  settings:
    govet:
      enable-all: true
    exhaustive:
      default-signifies-exhaustive: true
    tagliatelle:
      case:
        rules:
          # The JSON the package writes (Entry, the levels endpoint) uses
          # snake_case keys throughout.
          json: snake
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Keep field order when reordering only reduces pointer data.
      - linters:
          - govet
        text: '^fieldalignment: .* has [0-9]+ leading bytes of pointer data but optimal value is [0-9]+$'
      # Tests build errors in place, repeat their case names and unpack
      # fixtures they partly ignore; they open files and run the test
      # binary by path.
      - path: (_test\.go|internal/leakcheck/)
        linters:
          - goconst
          - dogsled
      - path: _test\.go
        linters:
          - gosec
        text: "G204|G304|G306"
      # Tests feed non-ASCII text to the encoders on purpose.
      - path: _test\.go
        linters:
          - gosmopolitan

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
